<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Schematic of photon-counting X-ray computed tomography of a rigid isochoric chamber during vitrification">
<title>Photon-counting X-ray CT of isochoric vitrification</title>
<defs>
  <marker id="bs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7CB0"/></marker>
</defs>
<rect width="800" height="500" fill="#E9F0F5"/>
<g font-family="IBM Plex Mono, monospace" font-size="15" fill="#4C6379">

  <!-- Source and fan beam -->
  <text x="92" y="212" text-anchor="middle" fill="#12263C">X-ray source</text>
  <rect x="70" y="230" width="42" height="40" rx="5" fill="#003262"/>
  <polygon points="112,250 640,120 640,380" fill="#2E7CB0" opacity="0.07"/>
  <line x1="112" y1="250" x2="640" y2="120" stroke="#2E7CB0" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.55"/>
  <line x1="112" y1="250" x2="640" y2="380" stroke="#2E7CB0" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.55"/>

  <!-- Cooling -->
  <text x="400" y="98" text-anchor="middle" fill="#12263C">cooling</text>
  <g stroke="#2E7CB0" stroke-width="2.2">
    <line x1="350" y1="114" x2="350" y2="152" marker-end="url(#bs)"/>
    <line x1="400" y1="114" x2="400" y2="152" marker-end="url(#bs)"/>
    <line x1="450" y1="114" x2="450" y2="152" marker-end="url(#bs)"/>
  </g>

  <!-- Rigid, constant-volume chamber -->
  <rect x="310" y="160" width="180" height="180" rx="14" fill="#D8E2EA" stroke="#003262" stroke-width="2.5"/>
  <rect x="328" y="178" width="144" height="144" rx="8" fill="#F4F8FA" stroke="#2E7CB0" stroke-width="1.5"/>

  <!-- Vitrified (amorphous) core -->
  <circle cx="400" cy="250" r="50" fill="#FDB515" fill-opacity="0.18" stroke="#DE9A00" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="400" y="255" text-anchor="middle" font-size="14" fill="#12263C">vitrified</text>

  <!-- Suppressed ice near the wall -->
  <g stroke="#2E7CB0" stroke-width="1.4" opacity="0.75">
    <path d="M345,190 l0,14 M338,197 l14,0 M340,192 l10,10 M350,192 l-10,10"/>
    <path d="M455,196 l0,14 M448,203 l14,0 M450,198 l10,10 M460,198 l-10,10"/>
    <path d="M348,300 l0,14 M341,307 l14,0 M343,302 l10,10 M353,302 l-10,10"/>
  </g>
  <text x="300" y="182" text-anchor="end" font-size="13">ice suppressed</text>
  <line x1="303" y1="187" x2="336" y2="196" stroke="#4C6379" stroke-width="1"/>

  <text x="400" y="364" text-anchor="middle" font-size="14" fill="#12263C">rigid isochoric chamber</text>

  <!-- Pressure rises because volume is fixed -->
  <line x1="470" y1="342" x2="506" y2="378" stroke="#4C6379" stroke-width="1.6"/>
  <circle cx="524" cy="398" r="26" fill="#fff" stroke="#003262" stroke-width="2"/>
  <line x1="524" y1="398" x2="540" y2="381" stroke="#DE9A00" stroke-width="2.6"/>
  <circle cx="524" cy="398" r="2.6" fill="#003262"/>
  <text x="524" y="446" text-anchor="middle" font-size="13">P rises at constant V</text>

  <!-- Photon-counting detector with energy bins -->
  <rect x="650" y="110" width="32" height="280" fill="#fff" stroke="#003262" stroke-width="2"/>
  <g stroke="#003262" stroke-width="0.8" opacity="0.55">
    <line x1="650" y1="150" x2="682" y2="150"/><line x1="650" y1="190" x2="682" y2="190"/>
    <line x1="650" y1="230" x2="682" y2="230"/><line x1="650" y1="270" x2="682" y2="270"/>
    <line x1="650" y1="310" x2="682" y2="310"/><line x1="650" y1="350" x2="682" y2="350"/>
  </g>
  <rect x="650" y="190" width="32" height="40" fill="#FDB515" fill-opacity="0.45"/>
  <rect x="650" y="270" width="32" height="40" fill="#2E7CB0" fill-opacity="0.35"/>
  <text x="712" y="250" text-anchor="middle" font-size="14" fill="#12263C" transform="rotate(-90 712 250)">photon-counting detector</text>
  <text x="748" y="250" text-anchor="middle" font-size="12" transform="rotate(-90 748 250)">energy-resolved bins</text>
</g>
</svg>
